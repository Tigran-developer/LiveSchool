<div class="min-h-screen flex items-center justify-center">
  <div class="container">
    <div style="width: 400px; margin: 0 auto;">
      <div class="card">
        <div class="text-center mb-6">
          <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔒</div>
          <h1 class="text-3xl font-bold mb-2">Reset Password</h1>
          <p class="text-sm" style="color: #6b7280;">
            Enter your new password
          </p>
        </div>

        <div *ngIf="!isSubmitted">
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label class="form-label required">{{ 'PASSWORD' | translate }}</label>
              <div class="relative">
                <input [type]="showPassword ? 'text' : 'password'" class="form-input pr-10" formControlName="password"
                       URequired="PASSWORD"
                       UPattern="WEAK_PASSWORD_VALIDATION"
                       [placeholder]="'CREATE_PASSWORD' | translate"
                />
                <button type="button" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                        (click)="togglePasswordVisibility()">
                  <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <svg *ngIf="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label required">{{ 'CONFIRM_PASSWORD' | translate }}</label>
              <div class="relative">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-input pr-10"
                       [class.error]="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched"
                       formControlName="confirmPassword"
                       [placeholder]="'CONFIRM_PASSWORD' | translate"
                />
                <button type="button" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                        (click)="toggleConfirmPasswordVisibility()">
                  <svg *ngIf="!showConfirmPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <svg *ngIf="showConfirmPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                  </svg>
                </button>
              </div>
              @if (resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched) {
                <span class="flex"
                      style="color: red; padding-top: 4px; font-size: 12px; display: inline-flex; align-items: center;">
                <i class="pi pi-info-circle" style="margin-right: 4px"></i>
                  <span *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">
                    {{ 'PLEASE_CONFIRM_PASSWORD' |translate }}
                  </span>
                  <span *ngIf="resetForm.get('confirmPassword')?.errors?.['passwordMismatch']">
                    {{ 'PASSWORD_DO_NOT_MATCH' |translate }}
                  </span>
              </span>
              }
            </div>
          </form>

          <div class="flex flex-col gap-2">
            <button class="btn btn-primary" (click)="resendEmail()">
              {{ 'CONFIRM' | translate }}
            </button>
          </div>
        </div>

        <div *ngIf="isSubmitted" class="text-center">
          <div style="font-size: 4rem; margin-bottom: 1rem; color: #10b981;">✓</div>
          <h2 class="text-xl font-semibold mb-4">Password has been changed successfully</h2>
        </div>
      </div>
    </div>
  </div>
</div>
