<div class="min-h-screen flex items-center justify-center">
  <div class="container flex items-center">
    <div style="width: 410px; margin: 0 auto;">
      <div class="card pt-2">
        <div class="text-center mb-6">
          <div style="font-size: 3rem; margin-bottom: 0.5rem;">🎓</div>
          <h1 class="text-3xl font-bold mb-2">{{ 'WELCOME_BACK' | translate }}</h1>
          <p class="text-sm" style="color: #6b7280;">{{ "SIGN_IN_TO_YOUR_ACCOUNT" | translate }}</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="submit$.next()">
          <div class="form-group">
            <label class="form-label">{{ "EMAIL_ADDRESS" | translate}}</label>
            <input type="email"  class="form-input" autocomplete="on" formControlName="email"
                   UPattern="PLEASE_ENTER_VALID_EMAIL"
                   [placeholder]="'ENTER_EMAIL' | translate"
            />
          </div>

          <div class="form-group">
            <div class="flex justify-between">
              <label class="form-label">{{ 'PASSWORD' | translate}}</label>
              <a routerLink="/forgot-password" class="btn-link text-sm">
                {{ "FORGOT_PASSWORD" | translate}}
              </a>
            </div>
            <div class="relative">
              <input [type]="showPassword ? 'text' : 'password'" class="form-input pr-10" formControlName="password"
                     URequired="PASSWORD"
                     [placeholder]="'ENTER_PASSWORD' | translate"
              />
              <button type="button" 
                      class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                      (click)="togglePasswordVisibility()">
                <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-full mb-4"
                  [disabled]="loginForm.invalid || isLoading" >
            {{ (isLoading ? 'SIGNING_IN___': 'SIGN_IN') | translate}}
          </button>

          <div class="error-message text-center" *ngIf="errorMessage">
            {{ errorMessage | translate }}
          </div>

          <div class="text-center">
            <span class="text-sm" style="color: #6b7280;">{{ 'DONT_HAVE_ACCOUNT' | translate}}</span>
            <a routerLink="/register" class="btn-link text-sm ml-1">{{ 'SIGN_UP' | translate}}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
